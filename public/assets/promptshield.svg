<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="prBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070512"/>
      <stop offset="50%" stop-color="#130c29"/>
      <stop offset="100%" stop-color="#04030a"/>
    </linearGradient>
    <linearGradient id="prCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.16)"/>
      <stop offset="50%" stop-color="rgba(99, 102, 241, 0.08)"/>
      <stop offset="100%" stop-color="rgba(11, 8, 24, 0.90)"/>
    </linearGradient>
    <radialGradient id="prVioletGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="prIndigoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#prBgGrad)"/>
  <circle cx="680" cy="90" r="310" fill="url(#prVioletGlow)"/>
  <circle cx="120" cy="390" r="250" fill="url(#prIndigoGlow)"/>

  <!-- Cyber Matrix Grid -->
  <g opacity="0.08" stroke="#8b5cf6" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Main Card Frame -->
  <rect x="70" y="55" width="660" height="340" rx="24" fill="url(#prCardGrad)" stroke="rgba(139, 92, 246, 0.42)" stroke-width="1.5"/>

  <!-- Badge Island -->
  <g transform="translate(110, 95)">
    <rect width="295" height="32" rx="16" fill="rgba(139, 92, 246, 0.14)" stroke="rgba(139, 92, 246, 0.45)" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#a78bfa"/>
    <text x="32" y="20.5" fill="#ddd6fe" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">AI RED-TEAMING // LLM FUZZER</text>
  </g>

  <!-- Title -->
  <text x="110" y="186" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="35" font-weight="800" letter-spacing="-0.5">PromptShield Fuzzer</text>

  <!-- Subtitle -->
  <text x="110" y="226" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="400">
    <tspan x="110" dy="0">Adversarial LLM prompt injection, context escape</tspan>
    <tspan x="110" dy="22">&amp; jailbreak resilience benchmark console.</tspan>
  </text>

  <!-- Tech Badges -->
  <g transform="translate(110, 286)">
    <rect x="0" y="0" width="88" height="32" rx="9" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.14)"/>
    <text x="14" y="20" fill="#c4b5fd" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">React 19</text>

    <rect x="98" y="0" width="102" height="32" rx="9" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.14)"/>
    <text x="112" y="20" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">TypeScript</text>

    <rect x="210" y="0" width="105" height="32" rx="9" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.14)"/>
    <text x="223" y="20" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">Tailwind v4</text>

    <rect x="325" y="0" width="115" height="32" rx="9" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.14)"/>
    <text x="336" y="20" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">Adversarial AI</text>
  </g>

  <!-- Right Graphic: LLM Shield & Prompt Brackets -->
  <g transform="translate(560, 152)">
    <circle cx="62" cy="64" r="56" fill="rgba(139, 92, 246, 0.06)" stroke="rgba(139, 92, 246, 0.30)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M62 20 L102 36 V74 C102 98 62 114 62 114 C62 114 22 98 22 74 V36 Z" fill="rgba(139, 92, 246, 0.12)" stroke="#8b5cf6" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="62" y="73" text-anchor="middle" fill="#ddd6fe" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800">&gt;_</text>
    <circle cx="94" cy="34" r="7" fill="#6366f1" stroke="#0d081d" stroke-width="2"/>
  </g>
</svg>
