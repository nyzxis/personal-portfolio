<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="pgBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="pgCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.12)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.6)"/>
    </linearGradient>
    <radialGradient id="pgCyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pgRoseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#pgBgGrad)"/>
  <circle cx="700" cy="90" r="280" fill="url(#pgCyanGlow)"/>
  <circle cx="100" cy="380" r="240" fill="url(#pgRoseGlow)"/>

  <!-- Cyber Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Main Card -->
  <rect x="70" y="55" width="660" height="340" rx="24" fill="url(#pgCardGrad)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1.5"/>

  <!-- Badge -->
  <g transform="translate(110, 100)">
    <rect width="210" height="32" rx="16" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.45)" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#06b6d4"/>
    <text x="32" y="20.5" fill="#67e8f9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">AI CYBER DEFENSE</text>
  </g>

  <!-- Title -->
  <text x="110" y="195" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">Phishing Detection AI</text>

  <!-- Subtitle -->
  <text x="110" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="400">
    ML threat classification for suspicious URLs &amp; deceptive emails with Explainable AI.
  </text>

  <!-- Tech tags -->
  <g transform="translate(110, 290)">
    <rect x="0" y="0" width="75" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="14" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">Python</text>

    <rect x="85" y="0" width="105" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="100" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">Scikit-Learn</text>

    <rect x="200" y="0" width="65" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="214" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">Flask</text>

    <rect x="275" y="0" width="70" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="289" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">React</text>

    <rect x="355" y="0" width="105" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="368" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">PostgreSQL</text>
  </g>
</svg>
