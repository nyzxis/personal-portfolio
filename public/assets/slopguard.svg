<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sgBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#171408"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="sgCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(234, 179, 8, 0.14)"/>
      <stop offset="50%" stop-color="rgba(250, 204, 21, 0.06)"/>
      <stop offset="100%" stop-color="rgba(14, 13, 10, 0.90)"/>
    </linearGradient>
    <radialGradient id="sgAmberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sgRedGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#sgBgGrad)"/>
  <circle cx="680" cy="90" r="310" fill="url(#sgAmberGlow)"/>
  <circle cx="120" cy="390" r="260" fill="url(#sgRedGlow)"/>

  <!-- Cyber Matrix Grid -->
  <g opacity="0.08" stroke="#eab308" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Main Card Frame -->
  <rect x="70" y="55" width="660" height="340" rx="24" fill="url(#sgCardGrad)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1.5"/>

  <!-- Badge Island -->
  <g transform="translate(110, 95)">
    <rect width="305" height="32" rx="16" fill="rgba(234, 179, 8, 0.12)" stroke="rgba(234, 179, 8, 0.45)" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#facc15"/>
    <text x="32" y="20.5" fill="#fde047" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">SUPPLY CHAIN // PACKAGE AUDITOR</text>
  </g>

  <!-- Title -->
  <text x="110" y="186" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="35" font-weight="800" letter-spacing="-0.5">SlopGuard Scanner</text>

  <!-- Subtitle -->
  <text x="110" y="226" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="400">
    <tspan x="110" dy="0">AI package hallucination detector, typosquatting</tspan>
    <tspan x="110" dy="22">&amp; malicious lifecycle script auditor.</tspan>
  </text>

  <!-- Tech Badges -->
  <g transform="translate(110, 286)">
    <rect x="0" y="0" width="88" height="32" rx="9" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.14)"/>
    <text x="14" y="20" fill="#fde047" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">React 19</text>

    <rect x="98" y="0" width="102" height="32" rx="9" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.14)"/>
    <text x="112" y="20" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">TypeScript</text>

    <rect x="210" y="0" width="105" height="32" rx="9" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.14)"/>
    <text x="223" y="20" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">Tailwind v4</text>

    <rect x="325" y="0" width="128" height="32" rx="9" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.14)"/>
    <text x="336" y="20" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">npm / PyPI / Cargo</text>
  </g>

  <!-- Right Graphic: Package Cube + Hazard Warning -->
  <g transform="translate(560, 152)">
    <circle cx="64" cy="64" r="56" fill="rgba(234, 179, 8, 0.06)" stroke="rgba(234, 179, 8, 0.30)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <!-- Isometric Box -->
    <polygon points="64,26 100,45 64,64 28,45" fill="rgba(250, 204, 21, 0.18)" stroke="#facc15" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="28,45 64,64 64,104 28,85" fill="rgba(234, 179, 8, 0.10)" stroke="#eab308" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="100,45 64,64 64,104 100,85" fill="rgba(234, 179, 8, 0.06)" stroke="#eab308" stroke-width="2" stroke-linejoin="round"/>
    <!-- Warning Alert Badge -->
    <g transform="translate(76, 74)">
      <polygon points="18,0 36,32 0,32" fill="#181207" stroke="#facc15" stroke-width="2" stroke-linejoin="round"/>
      <line x1="18" y1="11" x2="18" y2="21" stroke="#facc15" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="18" cy="26.5" r="1.6" fill="#facc15"/>
    </g>
  </g>
</svg>
