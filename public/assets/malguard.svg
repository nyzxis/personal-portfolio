<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="mgBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#110d1a"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="mgCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.12)"/>
      <stop offset="50%" stop-color="rgba(244, 63, 94, 0.08)"/>
      <stop offset="100%" stop-color="rgba(10, 13, 22, 0.88)"/>
    </linearGradient>
    <radialGradient id="mgAmberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mgRoseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mgVioletGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#mgBgGrad)"/>
  <circle cx="680" cy="100" r="320" fill="url(#mgAmberGlow)"/>
  <circle cx="140" cy="380" r="260" fill="url(#mgRoseGlow)"/>
  <circle cx="660" cy="340" r="220" fill="url(#mgVioletGlow)"/>

  <!-- Cyber Matrix Grid -->
  <g opacity="0.08" stroke="#f59e0b" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Main Card Container Doppelrand -->
  <rect x="70" y="55" width="660" height="340" rx="24" fill="url(#mgCardGrad)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1.5"/>

  <!-- Badge Island -->
  <g transform="translate(110, 95)">
    <rect width="310" height="32" rx="16" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.45)" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#f59e0b"/>
    <text x="32" y="20.5" fill="#fcd34d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">BINARY FORENSICS // ML CLASSIFIER</text>
  </g>

  <!-- Title -->
  <text x="110" y="190" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">MalGuard AI Detection</text>

  <!-- Subtitle -->
  <text x="110" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15.5" font-weight="400">
    PE binary dissection, Shannon entropy heatmap, and Explainable AI (XAI).
  </text>

  <!-- Tech tags -->
  <g transform="translate(110, 285)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="105" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="14" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">Scikit-Learn</text>

    <!-- Tag 2 -->
    <rect x="115" y="0" width="85" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="129" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">FastAPI</text>

    <!-- Tag 3 -->
    <rect x="210" y="0" width="80" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="224" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">Pandas</text>

    <!-- Tag 4 -->
    <rect x="300" y="0" width="85" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="314" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">React 19</text>
  </g>

  <!-- Graphic Threat Dial / Hex Crosshair Motif on Right Side -->
  <g transform="translate(560, 155)" opacity="0.9">
    <!-- Outer radar rings -->
    <circle cx="60" cy="65" r="60" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="60" cy="65" r="46" fill="rgba(245, 158, 11, 0.05)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
    <!-- Biohazard/Bug/Shield Emblem -->
    <path d="M60 32 L86 45 V74 C86 93 60 106 60 106 C60 106 34 93 34 74 V45 Z" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="2" stroke-linejoin="round"/>
    <!-- Dissection Crosshair -->
    <circle cx="60" cy="65" r="14" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <line x1="60" y1="46" x2="60" y2="51" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="60" y1="79" x2="60" y2="84" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="41" y1="65" x2="46" y2="65" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="74" y1="65" x2="79" y2="65" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="65" r="3" fill="#f43f5e"/>
  </g>
</svg>
