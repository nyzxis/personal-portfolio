<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="psBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030a07"/>
      <stop offset="50%" stop-color="#061b12"/>
      <stop offset="100%" stop-color="#020604"/>
    </linearGradient>
    <linearGradient id="psCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.14)"/>
      <stop offset="50%" stop-color="rgba(0, 255, 102, 0.07)"/>
      <stop offset="100%" stop-color="rgba(6, 18, 12, 0.90)"/>
    </linearGradient>
    <radialGradient id="psGreenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="psMintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#psBgGrad)"/>
  <circle cx="680" cy="90" r="310" fill="url(#psGreenGlow)"/>
  <circle cx="120" cy="390" r="250" fill="url(#psMintGlow)"/>

  <!-- Cyber Matrix Grid -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Main Card Frame -->
  <rect x="70" y="55" width="660" height="340" rx="24" fill="url(#psCardGrad)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>

  <!-- Badge Island -->
  <g transform="translate(110, 95)">
    <rect width="325" height="32" rx="16" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#00ff66"/>
    <text x="32" y="20.5" fill="#6ee7b7" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">NETWORK FORENSICS // PCAP DISSECTOR</text>
  </g>

  <!-- Title -->
  <text x="110" y="186" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="35" font-weight="800" letter-spacing="-0.5">PacketScope Inspector</text>

  <!-- Subtitle -->
  <text x="110" y="226" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="400">
    <tspan x="110" dy="0">Wireshark-style deep packet dissector, TLS 1.3</tspan>
    <tspan x="110" dy="22">handshake analyzer &amp; live hex dump matrix.</tspan>
  </text>

  <!-- Tech Badges -->
  <g transform="translate(110, 286)">
    <rect x="0" y="0" width="88" height="32" rx="9" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.14)"/>
    <text x="14" y="20" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">React 19</text>

    <rect x="98" y="0" width="102" height="32" rx="9" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.14)"/>
    <text x="112" y="20" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">TypeScript</text>

    <rect x="210" y="0" width="112" height="32" rx="9" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.14)"/>
    <text x="220" y="20" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">HTML5 Canvas</text>

    <rect x="332" y="0" width="114" height="32" rx="9" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.14)"/>
    <text x="344" y="20" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">PCAP / TLS 1.3</text>
  </g>

  <!-- Right Graphic: Oscilloscope Wave + Hex Stream -->
  <g transform="translate(558, 152)">
    <circle cx="66" cy="64" r="56" fill="rgba(16, 185, 129, 0.06)" stroke="rgba(16, 185, 129, 0.30)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="16" y="26" width="100" height="74" rx="12" fill="rgba(4, 14, 10, 0.9)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1.5"/>
    <!-- Waveform -->
    <polyline points="24,62 36,62 44,40 54,84 64,46 74,76 84,54 94,62 108,62" fill="none" stroke="#00ff66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Mini Hex Footer -->
    <text x="66" y="92" text-anchor="middle" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">16 03 03 00 F8</text>
  </g>
</svg>
