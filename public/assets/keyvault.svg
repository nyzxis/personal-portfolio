<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="kvBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a"/>
      <stop offset="50%" stop-color="#061214"/>
      <stop offset="100%" stop-color="#020406"/>
    </linearGradient>
    <linearGradient id="kvCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.12)"/>
      <stop offset="100%" stop-color="rgba(8, 12, 18, 0.75)"/>
    </linearGradient>
    <radialGradient id="kvEmeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kvCyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#kvBgGrad)"/>
  <circle cx="680" cy="80" r="290" fill="url(#kvEmeraldGlow)"/>
  <circle cx="120" cy="380" r="260" fill="url(#kvCyanGlow)"/>

  <!-- Cyber Matrix Grid -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Main Card Doppelrand -->
  <rect x="70" y="55" width="660" height="340" rx="24" fill="url(#kvCardGrad)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.5"/>

  <!-- Badge Island -->
  <g transform="translate(110, 95)">
    <rect width="260" height="32" rx="16" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#10b981"/>
    <text x="32" y="20.5" fill="#6ee7b7" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">ZERO-KNOWLEDGE SECURITY</text>
  </g>

  <!-- Title -->
  <text x="110" y="190" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">KeyVault Security Analyzer</text>

  <!-- Subtitle -->
  <text x="110" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15.5" font-weight="400">
    Entropy modeling, brute-force simulation &amp; HIBP k-Anonymity breach detection.
  </text>

  <!-- Tech tags -->
  <g transform="translate(110, 285)">
    <rect x="0" y="0" width="85" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="14" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">React 19</text>

    <rect x="95" y="0" width="95" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="109" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">TypeScript</text>

    <rect x="200" y="0" width="90" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="214" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">Tailwind v4</text>

    <rect x="300" y="0" width="75" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="314" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">FastAPI</text>

    <rect x="385" y="0" width="90" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="398" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">HIBP API</text>
  </g>
</svg>