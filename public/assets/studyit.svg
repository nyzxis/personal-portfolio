<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d14"/>
      <stop offset="50%" stop-color="#141526"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="radialAccent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <circle cx="700" cy="80" r="260" fill="url(#radialAccent)"/>
  <circle cx="100" cy="380" r="200" fill="url(#radialAccent)"/>

  <!-- Subtle Grid -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Central Card -->
  <rect x="70" y="55" width="660" height="340" rx="24" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Top Badge -->
  <g transform="translate(110, 100)">
    <rect width="120" height="32" rx="16" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#6366f1"/>
    <text x="32" y="21" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">STUDYIT</text>
  </g>

  <!-- Title -->
  <text x="110" y="195" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">Learning Port Study Hub</text>

  <!-- Subtitle -->
  <text x="110" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
    A calm, focused study dock with curated notes, self-tests &amp; Pomodoro timer.
  </text>

  <!-- Tech tags -->
  <g transform="translate(110, 290)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="85" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="14" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">HTML5</text>

    <!-- Tag 2 -->
    <rect x="95" y="0" width="75" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="109" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">CSS3</text>

    <!-- Tag 3 -->
    <rect x="180" y="0" width="125" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="194" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">JavaScript</text>

    <!-- Tag 4 -->
    <rect x="315" y="0" width="105" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="329" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">Responsive</text>
  </g>
</svg>
