<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="apiBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <linearGradient id="apiCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.14)"/>
      <stop offset="50%" stop-color="rgba(59, 130, 246, 0.08)"/>
      <stop offset="100%" stop-color="rgba(8, 12, 24, 0.90)"/>
    </linearGradient>
    <radialGradient id="apiCyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="apiBlueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="apiEmeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#apiBgGrad)"/>
  <circle cx="690" cy="90" r="320" fill="url(#apiCyanGlow)"/>
  <circle cx="120" cy="390" r="260" fill="url(#apiBlueGlow)"/>
  <circle cx="680" cy="350" r="240" fill="url(#apiEmeraldGlow)"/>

  <!-- Cyber Matrix Grid -->
  <g opacity="0.08" stroke="#06b6d4" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Main Card Doppelrand Frame -->
  <rect x="70" y="55" width="660" height="340" rx="24" fill="url(#apiCardGrad)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5"/>

  <!-- Badge Island -->
  <g transform="translate(110, 95)">
    <rect width="250" height="32" rx="16" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.45)" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#06b6d4"/>
    <text x="32" y="21" fill="#67e8f9" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5">ACTIVE DEFENSE // OWASP API TOP 10</text>
  </g>

  <!-- Title -->
  <text x="110" y="190" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">APIShield Pentester</text>

  <!-- Subtitle -->
  <text x="110" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15.5" font-weight="400">
    Automated REST API security testing, BOLA/IDOR exploits &amp; JWT verification.
  </text>

  <!-- Tech Badges -->
  <g transform="translate(110, 275)">
    <rect width="115" height="28" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)"/>
    <text x="14" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">FastAPI + Python</text>

    <rect x="125" width="105" height="28" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)"/>
    <text x="140" y="18" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">PostgreSQL</text>

    <rect x="240" width="95" height="28" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)"/>
    <text x="254" y="18" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">React 19</text>

    <rect x="345" width="125" height="28" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)"/>
    <text x="358" y="18" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">OWASP Top 10</text>
  </g>

  <!-- Floating Graphic Hologram -->
  <g transform="translate(560, 140)">
    <!-- Outer Shield Glow -->
    <path d="M 60 20 L 110 40 L 110 95 C 110 135 60 165 60 165 C 60 165 10 135 10 95 L 10 40 Z" fill="rgba(6, 182, 212, 0.08)" stroke="#06b6d4" stroke-width="2.5" filter="drop-shadow(0 0 12px rgba(6,182,212,0.45))"/>
    <path d="M 40 85 L 55 100 L 85 65" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Score Badge Card -->
    <g transform="translate(50, 110)">
      <rect width="70" height="42" rx="10" fill="rgba(10, 15, 30, 0.95)" stroke="rgba(6, 182, 212, 0.5)" stroke-width="1.5"/>
      <text x="35" y="24" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800">A+</text>
      <text x="35" y="36" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">GRADE</text>
    </g>
  </g>
</svg>
