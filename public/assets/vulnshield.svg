<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="vsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#06131f"/>
      <stop offset="100%" stop-color="#02050b"/>
    </linearGradient>
    <linearGradient id="vsCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.14)"/>
      <stop offset="50%" stop-color="rgba(14, 165, 233, 0.08)"/>
      <stop offset="100%" stop-color="rgba(8, 15, 26, 0.85)"/>
    </linearGradient>
    <radialGradient id="vsEmeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vsCyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vsAmberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#vsBgGrad)"/>
  <circle cx="680" cy="90" r="300" fill="url(#vsEmeraldGlow)"/>
  <circle cx="120" cy="390" r="260" fill="url(#vsCyanGlow)"/>
  <circle cx="650" cy="320" r="220" fill="url(#vsAmberGlow)"/>

  <!-- Cyber Matrix Grid -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Main Card Container Doppelrand -->
  <rect x="70" y="55" width="660" height="340" rx="24" fill="url(#vsCardGrad)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1.5"/>

  <!-- Badge Island -->
  <g transform="translate(110, 95)">
    <rect width="235" height="32" rx="16" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#10b981"/>
    <text x="32" y="21" fill="#6ee7b7" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5">OFFENSIVE RECON // VULN AUDIT</text>
  </g>

  <!-- Title -->
  <text x="110" y="190" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">VulnShield Security Scanner</text>

  <!-- Subtitle -->
  <text x="110" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15.5" font-weight="400">
    OWASP Top 10 automated fuzzing, XSS &amp; SQLi heuristics, and security header auditing.
  </text>

  <!-- Tech tags -->
  <g transform="translate(110, 285)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="85" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="14" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">FastAPI</text>

    <!-- Tag 2 -->
    <rect x="95" y="0" width="85" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="109" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">React 19</text>

    <!-- Tag 3 -->
    <rect x="190" y="0" width="115" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="204" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">BeautifulSoup</text>

    <!-- Tag 4 -->
    <rect x="315" y="0" width="95" height="34" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="329" y="22" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="500">Tailwind v4</text>
  </g>

  <!-- Graphic Shield Emblem on Right Side -->
  <g transform="translate(560, 160)" opacity="0.85">
    <circle cx="60" cy="60" r="55" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="60" cy="60" r="42" fill="rgba(16, 185, 129, 0.06)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <path d="M60 30 L85 42 V68 C85 85 60 96 60 96 C60 96 35 85 35 68 V42 Z" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="2" stroke-linejoin="round"/>
    <path d="M52 62 L58 68 L70 54" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
