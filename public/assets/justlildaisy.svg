<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="jdBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d060a"/>
      <stop offset="50%" stop-color="#1e0b16"/>
      <stop offset="100%" stop-color="#070406"/>
    </linearGradient>
    <linearGradient id="jdCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(236, 64, 122, 0.15)"/>
      <stop offset="50%" stop-color="rgba(244, 143, 177, 0.08)"/>
      <stop offset="100%" stop-color="rgba(18, 8, 14, 0.90)"/>
    </linearGradient>
    <radialGradient id="jdRoseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec407a" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ec407a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jdPinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f48fb1" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#f48fb1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#jdBgGrad)"/>
  <circle cx="680" cy="90" r="310" fill="url(#jdRoseGlow)"/>
  <circle cx="120" cy="390" r="250" fill="url(#jdPinkGlow)"/>

  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ec407a" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Main Card Frame -->
  <rect x="70" y="55" width="660" height="340" rx="24" fill="url(#jdCardGrad)" stroke="rgba(236, 64, 122, 0.42)" stroke-width="1.5"/>

  <!-- Badge Island -->
  <g transform="translate(110, 95)">
    <rect width="320" height="32" rx="16" fill="rgba(236, 64, 122, 0.14)" stroke="rgba(236, 64, 122, 0.48)" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#f06292"/>
    <text x="32" y="20.5" fill="#f8bbd0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">BESPOKE COMMERCE // CAKE CUSTOMIZER</text>
  </g>

  <!-- Title -->
  <text x="110" y="186" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="35" font-weight="800" letter-spacing="-0.5">Just Lil Daisy Studio</text>

  <!-- Subtitle -->
  <text x="110" y="226" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="400">
    <tspan x="110" dy="0">Artisanal custom cake &amp; cupcake studio with</tspan>
    <tspan x="110" dy="22">live price builder and instant WhatsApp orders.</tspan>
  </text>

  <!-- Tech Badges -->
  <g transform="translate(110, 286)">
    <rect x="0" y="0" width="88" height="32" rx="9" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.14)"/>
    <text x="14" y="20" fill="#f48fb1" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">React 18</text>

    <rect x="98" y="0" width="108" height="32" rx="9" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.14)"/>
    <text x="111" y="20" fill="#f8bbd0" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">Tailwind CSS</text>

    <rect x="216" y="0" width="88" height="32" rx="9" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.14)"/>
    <text x="230" y="20" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">Anime.js</text>

    <rect x="314" y="0" width="114" height="32" rx="9" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.14)"/>
    <text x="325" y="20" fill="#f06292" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600">WhatsApp API</text>
  </g>

  <!-- Right Graphic: Tiered Cake + Sparkle -->
  <g transform="translate(560, 152)">
    <circle cx="62" cy="64" r="56" fill="rgba(236, 64, 122, 0.06)" stroke="rgba(236, 64, 122, 0.30)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <!-- Top tier -->
    <rect x="42" y="42" width="40" height="24" rx="5" fill="rgba(244, 143, 177, 0.16)" stroke="#f48fb1" stroke-width="2"/>
    <!-- Bottom tier -->
    <rect x="28" y="66" width="68" height="30" rx="6" fill="rgba(236, 64, 122, 0.16)" stroke="#ec407a" stroke-width="2"/>
    <!-- Plate -->
    <line x1="20" y1="98" x2="104" y2="98" stroke="#f8bbd0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Candle / topper -->
    <line x1="62" y1="28" x2="62" y2="42" stroke="#f8bbd0" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="62" cy="24" r="4" fill="#f48fb1"/>
  </g>
</svg>
